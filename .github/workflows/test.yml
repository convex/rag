name: Test and lint
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache-dependency-path: package-lock.json
          node-version: "24.22.2"
          cache: "npm"

      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Validate release notes when the proposed merge changes the version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          version=$(jq -r .version package.json)
          previous=$(git show "$BASE_SHA:package.json" | jq -r .version)
          if [[ "$version" != "$previous" ]]; then
            git update-ref refs/heads/main HEAD
            npx changeset status --output "$RUNNER_TEMP/changesets.json"
            jq -e '.changesets | length == 0' "$RUNNER_TEMP/changesets.json"
            awk -v version="$version" '/^## / { active=($0 == "## " version); next } active && !/^#/ && /[[:alnum:]]/ { found=1 } END { exit !found }' CHANGELOG.md
          fi
      - name: Test
        run: npm run check
      - name: Run E2E smoke test and verify generated code
        env:
          CONVEX_AGENT_MODE: anonymous
          CONVEX_DISABLE_TELEMETRY: "1"
        run: |
          npm run test:e2e
          git diff --exit-code -- src/component/_generated
          test -z "$(git ls-files --others --exclude-standard src/component/_generated)"
      - name: Publish package for testing branch
        run: npx pkg-pr-new publish || echo "Have you set up pkg-pr-new?"
